<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Event Timekeeper</title>
  <meta name="description" content="タイムスケジュールを入力して、次の予定を表示するWebアプリ" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --panel: #101010;
      --panel-2: #151515;
      --line: #2a2a2a;
      --text: #f5f5f5;
      --muted: #a7a7a7;
      --accent: #7dd3fc;
      --good: #7dff9b;
      --bad: #ff7d7d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 16px;
    }

    .app {
      width: min(1100px, 100%);
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .hero {
      padding: 24px 20px 16px;
      border-bottom: 1px solid var(--line);
      text-align: center;
      background: radial-gradient(circle at top, rgba(125, 211, 252, 0.12), transparent 45%);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1.1;
    }

    .subtitle {
      margin: 12px auto 0;
      max-width: 52em;
      color: var(--muted);
      font-size: clamp(14px, 2.3vw, 18px);
      line-height: 1.6;
    }

    .content {
      display: grid;
      gap: 16px;
      padding: 16px;
    }

    @media (min-width: 900px) {
      .content {
        grid-template-columns: 1.1fr .9fr;
      }
    }

    .panel {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
    }

    .panel-title {
      margin: 0 0 12px;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    label {
      font-size: 14px;
      color: var(--muted);
    }

    input[type="text"], input[type="time"], textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #090909;
      color: var(--text);
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    input[type="time"] {
      min-height: 54px;
      font-size: 18px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.6;
    }

    input:focus, textarea:focus {
      border-color: rgba(125, 211, 252, 0.8);
      box-shadow: 0 0 0 4px rgba(125, 211, 252, 0.12);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      background: #111;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      min-height: 52px;
      cursor: pointer;
    }

    button.primary {
      background: var(--text);
      color: #000;
      border-color: transparent;
    }

    .time-display {
      font-family: "DIN Next", "DIN 2014", "Avenir Next Condensed", "Helvetica Neue Condensed", "Roboto Condensed", system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1, "lnum" 1;
      letter-spacing: .04em;
    }

    .clock {
      font-size: clamp(40px, 12vw, 240px);
      line-height: 1;
      font-weight: 800;
      text-align: center;
      margin: 8px 0 2px;
    }

    .date {
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .next-box {
      margin: 12px auto 0;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--panel);
      max-width: 520px;
      text-align: center;
    }

    .next-label {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .next-value {
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 800;
      line-height: 1.2;
    }

    .next-time {
      margin-top: 4px;
      color: var(--accent);
      font-size: clamp(16px, 4vw, 20px);
      font-weight: 700;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
      background: var(--panel);
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 12px 10px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.02);
    }

    td input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #090909;
      color: var(--text);
      font-size: 15px;
    }

    tr.best {
      outline: 2px solid rgba(125, 211, 252, 0.35);
      outline-offset: -2px;
      background: rgba(125, 211, 252, 0.08);
    }

    .summary-grid {
      display: grid;
      gap: 12px;
    }

    .summary-card {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
    }

    .summary-label {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 18px;
      line-height: 1.5;
    }

    .diff {
      font-size: clamp(34px, 9vw, 68px);
      line-height: 1.05;
      font-weight: 800;
      margin: 6px 0 10px;
      text-align: center;
    }

    .diff.positive { color: var(--bad); }
    .diff.negative { color: var(--good); }

    .status {
      color: var(--muted);
      text-align: center;
      font-size: 15px;
      line-height: 1.6;
    }

    .footer-note {
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      padding: 0 16px 18px;
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">Event Timekeeper</p>
      <h1>Event Timetable</h1>
      <p class="subtitle">Created by Kumapuni</p>
    </header>

    <section class="content">
      <section class="panel">
        <h2 class="panel-title">Current Time</h2>
        <div id="nowTime" class="time-display clock">--:--:--</div>
        <div id="nowDate" class="date">----</div>
        <div class="next-box">
          <div class="next-label">Next Schedule</div>
          <div id="nextName" class="next-value">--</div>
          <div id="nextTime" class="next-time">--:--:--</div>
        </div>
        <div id="bestDiff" class="time-display diff">--:--:--</div>
        <div id="bestStatus" class="status">スケジュールを入力してください。</div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Schedule Table</h2>
        <div class="field">
          <label for="scheduleName">スケジュール名</label>
          <input id="scheduleName" type="text" placeholder="例: 本番タイムスケジュール" />
        </div>
        <div class="field">
          <label for="scheduleNote">メモ</label>
          <textarea id="scheduleNote" placeholder="例: 現在10分遅れ、5分前にアナウンス、転換は短め"></textarea>
        </div>
        <div class="buttons">
          <button id="addRowBtn" class="primary" type="button">行を追加</button>
          <button id="sampleBtn" type="button">サンプル入力</button>
        </div>
      </section>

      <section class="panel" style="grid-column: 1 / -1;">
        <h2 class="panel-title">Time Schedule</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width: 30%;">項目</th>
                <th style="width: 18%;">時刻</th>
                <th style="width: 24%;">差分</th>
                <th style="width: 28%;">メモ</th>
                <th style="width: 10%;">操作</th>
              </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
          </table>
        </div>
      </section>

      <section class="summary-grid" style="grid-column: 1 / -1;">
        <div class="summary-card">
          <div class="summary-label">現在時刻に現在も近い未来の予定</div>
          <div id="closestName" class="summary-value">--</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">比較結果</div>
          <div id="closestDetail" class="summary-value">--</div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'eventtime-schedule-v1';
    const nowTimeEl = document.getElementById('nowTime');
    const nowDateEl = document.getElementById('nowDate');
    const nextNameEl = document.getElementById('nextName');
    const nextTimeEl = document.getElementById('nextTime');
    const bestDiffEl = document.getElementById('bestDiff');
    const bestStatusEl = document.getElementById('bestStatus');
    const scheduleBody = document.getElementById('scheduleBody');
    const closestNameEl = document.getElementById('closestName');
    const closestDetailEl = document.getElementById('closestDetail');
    const addRowBtn = document.getElementById('addRowBtn');
    const sampleBtn = document.getElementById('sampleBtn');
    const scheduleNameEl = document.getElementById('scheduleName');
    const scheduleNoteEl = document.getElementById('scheduleNote');

    const pad = (n) => String(n).padStart(2, '0');

    function formatClock(date) {
      return `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function formatDate(date) {
      return date.toLocaleDateString('ja-JP', {
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
      });
    }

    function formatDiff(ms) {
      const total = Math.floor(Math.abs(ms) / 1000);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    function parseTimeValue(value, baseDate = new Date()) {
      if (!value) return null;
      const parts = value.split(':').map(Number);
      if (parts.length < 2 || Number.isNaN(parts[0]) || Number.isNaN(parts[1])) return null;
      const [h, m, s = 0] = parts;
      const d = new Date(baseDate);
      d.setHours(h, m, s, 0);
      return d;
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function rowTemplate({ name = '', time = '', note = '' } = {}) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input class="row-name" type="text" placeholder="例: 開始" value="${escapeHtml(name)}"></td>
        <td><input class="row-time time-display" type="time" step="1" value="${escapeHtml(time)}"></td>
        <td class="row-diff time-display">--</td>
        <td><input class="row-note" type="text" placeholder="メモ" value="${escapeHtml(note)}"></td>
        <td><button class="row-remove" type="button">削除</button></td>
      `;
      tr.querySelector('.row-remove').addEventListener('click', () => {
        tr.remove();
        saveState();
        update();
      });
      tr.querySelectorAll('input').forEach((el) => el.addEventListener('input', () => {
        saveState();
        update();
      }));
      return tr;
    }

    function addRow(data) {
      scheduleBody.appendChild(rowTemplate(data));
    }

    function getRows() {
      return [...scheduleBody.querySelectorAll('tr')];
    }

    function getState() {
      return {
        scheduleName: scheduleNameEl.value,
        scheduleNote: scheduleNoteEl.value,
        rows: getRows().map((row) => ({
          name: row.querySelector('.row-name').value,
          time: row.querySelector('.row-time').value,
          note: row.querySelector('.row-note').value,
        }))
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(getState()));
    }

    function restoreState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const state = JSON.parse(raw);
        scheduleNameEl.value = state.scheduleName || '';
        scheduleNoteEl.value = state.scheduleNote || '';
        scheduleBody.innerHTML = '';
        (state.rows || []).forEach(addRow);
        return true;
      } catch {
        return false;
      }
    }

    function update() {
      const now = new Date();
      nowTimeEl.textContent = formatClock(now);
      nowDateEl.textContent = formatDate(now);

      const rows = getRows();
      let nextRow = null;
      let nextDiff = Infinity;
      let nextSigned = 0;

      rows.forEach((row) => {
        const timeInput = row.querySelector('.row-time').value;
        const diffCell = row.querySelector('.row-diff');
        row.classList.remove('best');

        const target = parseTimeValue(timeInput, now);
        if (!target) {
          diffCell.textContent = '--';
          diffCell.style.color = 'var(--muted)';
          return;
        }

        const diffMs = now.getTime() - target.getTime();
        const abs = Math.abs(diffMs);
        const diffText = `${diffMs >= 0 ? '+' : '-'} ${formatDiff(diffMs)}`;
        diffCell.textContent = diffText;
        diffCell.style.color = diffMs >= 0 ? 'var(--bad)' : 'var(--good)';

        if (diffMs < 0 && abs < nextDiff) {
          nextDiff = abs;
          nextSigned = diffMs;
          nextRow = row;
        }
      });

      if (nextRow) {
        nextRow.classList.add('best');
        const nextName = nextRow.querySelector('.row-name').value.trim() || '（無題）';
        const nextTime = nextRow.querySelector('.row-time').value;
        nextNameEl.textContent = nextName;
        nextTimeEl.textContent = nextTime;

        const diffText = `- ${formatDiff(nextSigned)}`;
        bestDiffEl.textContent = diffText;
        bestDiffEl.className = 'time-display diff negative';
        bestStatusEl.textContent = '現在時刻は、その予定時刻より前です。';
        closestNameEl.textContent = `${nextName} / ${nextTime}`;
        closestDetailEl.textContent = `現在時刻との差分: ${diffText}（未来の予定のうち最も近いもの）`;
      } else {
        nextNameEl.textContent = '--';
        nextTimeEl.textContent = '--:--:--';
        bestDiffEl.textContent = '--:--:--';
        bestDiffEl.className = 'time-display diff';
        bestStatusEl.textContent = '未来の予定がありません。';
        closestNameEl.textContent = '--';
        closestDetailEl.textContent = '--';
      }
    }

    [scheduleNameEl, scheduleNoteEl].forEach((el) => el.addEventListener('input', () => {
      saveState();
    }));

    addRowBtn.addEventListener('click', () => {
      addRow();
      saveState();
      update();
    });

    sampleBtn.addEventListener('click', () => {
      scheduleNameEl.value = '本番タイムスケジュール';
      scheduleNoteEl.value = 'サンプルデータ';
      scheduleBody.innerHTML = '';
      [
        { name: '開場', time: '09:30:00', note: '受付開始' },
        { name: '開始', time: '10:00:00', note: '本番スタート' },
        { name: '休憩', time: '10:30:00', note: '5分間' },
        { name: '終了', time: '11:00:00', note: '撤収案内' },
      ].forEach(addRow);
      saveState();
      update();
    });

    if (!restoreState()) {
      addRow({ name: '開始', time: '10:00:00', note: 'サンプル' });
      addRow({ name: '挨拶', time: '10:05:00', note: '' });
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
